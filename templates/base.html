<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>dnamic Aircraft Services</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  
  <!-- FullCalendar JS & CSS (all-in-one bundle) -->
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.14/index.global.min.js'></script>
</head>
<body class="dark-mode">
  <!-- Global Background Image -->
  <div class="background-image"></div>
  <div class="overlay">
    <div class="centered-title-container">
      <h1 class="main-title">
        D-namic Aircraft services <span class="fresh-highlight">24FRESH simulator</span>
      </h1>
    </div>
    <div class="nav-wrapper">
      <hr class="separator">
      {% include 'navbar.html' %}
      <hr class="separator">
    </div>
    {% block content %}
    {% endblock %}
    <footer class="footer-container">
      <a href="https://www.dnamic-tech.com" target="_blank" rel="noopener noreferrer">
        Visit DNAMIC Tech
      </a>
    </footer>
  </div>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <!-- Navbar JS -->
  <script src="{{ url_for('static', filename='js/navbar.js') }}"></script>
  <!-- Page-specific JavaScript -->
  {% block extra_js %}
  {% endblock %}
</body>
</html>
