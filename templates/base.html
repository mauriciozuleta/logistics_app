<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>dnamic Aircraft Services</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  
  <!-- FullCalendar CSS -->
  <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.14/main.min.css' rel='stylesheet' />
</head>

<body class="dark-mode">
  <!-- Global Background Image -->
  <div class="background-image"></div>
  
  <div class="overlay">

  <!-- Centered Main Page Heading -->
  <div class="centered-title-container">
    <h1 class="main-title">Dnamic Aircraft services</h1>
  </div>

  <!-- Navbar Section -->
  <div class="nav-wrapper">
    <hr class="separator">
    {% include 'navbar.html' %}
    <hr class="separator">
  </div>

    <!-- Page-Specific Content -->
    {% block content %}
    {% endblock %}

</div>
<footer class="footer-container">
  <a href="https://www.dnamic-tech.com" target="_blank" rel="noopener noreferrer">
    Visit DNAMIC Tech
  </a>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

<!-- FullCalendar JS -->
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.14/main.min.js'></script>

<!-- Page-specific JavaScript -->
{% block extra_js %}
{% endblock %}

</body>
</html>
