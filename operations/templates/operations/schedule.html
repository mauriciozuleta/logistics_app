{% extends 'base.html' %}

{% block content %}
<style>
  .schedule-container {
    display: flex;
    gap: 1.5rem;
    height: 85vh; /* Set a good height for the calendar */
  }
  #calendar-wrapper {
    flex: 3; /* Calendar takes up 3/4 of the space */
    background-color: #1e2228;
    padding: 1rem;
    border-radius: 8px;
    border: 1px solid #2196f3;
  }
  #details-panel {
    flex: 1; /* Details panel takes up 1/4 of the space */
    background-color: #1e2228;
    padding: 1rem;
    border-radius: 8px;
    border: 1px solid #444;
    overflow-y: auto;
  }
  /* Style FullCalendar to match the dark theme */
  :root {
    --fc-border-color: #444;
    --fc-daygrid-event-dot-width: 8px;
    --fc-list-event-dot-width: 10px;
    --fc-event-bg-color: #2196f3;
    --fc-event-border-color: #1976d2;
    --fc-event-text-color: #fff;
    --fc-page-bg-color: #1e2228;
    --fc-neutral-bg-color: rgba(200, 200, 200, 0.1);
    --fc-list-even-row-bg-color: rgba(200, 200, 200, 0.05);
  }
  .fc .fc-button-primary {
    background-color: #2196f3;
    border-color: #2196f3;
  }
  .fc .fc-button-primary:hover {
    background-color: #1976d2;
    border-color: #1976d2;
  }
  .fc .fc-daygrid-day.fc-day-today {
    background-color: rgba(255, 92, 0, 0.15);
  }
</style>

<div class="content-section schedule-container">
  <div id="calendar-wrapper">
    <div id="calendar"></div>
  </div>
  <div id="details-panel">
    <h3>Shipment Details</h3>
    <p>Click on a shipment in the calendar to see details here.</p>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
  var calendarEl = document.getElementById('calendar');
  
  var calendar = new FullCalendar.Calendar(calendarEl, {
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'dayGridMonth,timeGridWeek,timeGridDay,listYear'
    },
    initialView: 'dayGridMonth',
    navLinks: true, // can click day/week names to navigate views
    editable: true, // allows dragging and resizing
    dayMaxEvents: true, // allow "more" link when too many events
    height: '100%', // Make the calendar fill its container
  });
  
  calendar.render();
});
</script>
{% endblock %}
