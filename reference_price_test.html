<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reference Price Google Search Test</title>
  <style>
    body { font-family: Arial, sans-serif; background: #23272f; color: #fff; padding: 40px; }
    .search-box { background: #1e2228; padding: 24px; border-radius: 8px; max-width: 500px; margin: auto; }
    label { color: #FF5C00; font-weight: bold; }
    input, select { margin-bottom: 16px; width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #2196f3; }
    button { background:#FF5C00; color:#fff; border:none; padding:10px 24px; border-radius:4px; cursor:pointer; font-size:1rem; }
  </style>
</head>
<body>
  <div class="search-box">
    <h2>Test Reference Price Google Search</h2>
    <form id="google-search-form" action="https://www.google.com/search" method="get" target="_blank">
      <label for="product">Product Name:</label>
      <input type="text" id="product" name="product" value="avocado" required>
      <label for="country">Country:</label>
      <input type="text" id="country" name="country" value="USA" required>
      <input type="hidden" id="query" name="q" value="">
      <button type="submit">Search on Google</button>
    </form>
  </div>
  <script>
    const form = document.getElementById('google-search-form');
    form.addEventListener('submit', function(e) {
      const product = document.getElementById('product').value.trim();
      const country = document.getElementById('country').value.trim();
      const query = `Average price of ${product} in ${country}`;
      document.getElementById('query').value = query;
    });
  </script>
</body>
</html>
