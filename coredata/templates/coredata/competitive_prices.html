{% extends "base.html" %}



{% block content %}
<div class="container mt-4">
    <h2>Competitive Prices for {{ country }}</h2>
    <hr>
    <div class="row" id="competitive-prices-content">
        <!-- Left column: Product list -->
        <div class="col-md-6">
            <h5>Products (not from {{ country }})</h5>
            <div style="max-height: 500px; overflow-y: auto; border: 1px solid #eee; border-radius: 6px; background: #fafafa;">
                <table class="table table-striped table-hover mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Trade Unit</th>
                            <th>Input</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                    {% for product in products %}
                        <tr>
                            <td>{{ product.id }}</td>
                            <td>{{ product.name }}</td>
                            <td>{{ product.trade_unit }}</td>
                            <td>
                                <input type="text" class="form-control form-control-sm" placeholder="$ value" style="width: 90px;" id="input-{{ product.id }}">
                            </td>
                            <td>
                                <button class="btn btn-primary btn-sm" style="width: 80px;" onclick="searchPrice('{{ product.id }}', '{{ product.name|escape }}', '{{ country|escape }}')">Search</button>
                            </td>
                        </tr>
                    {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
        <!-- Right column: Bing search iframe -->
        <div class="col-md-6">
            <h5>Average Price Search Result</h5>
            <iframe id="search-iframe" src="" width="100%" height="400" style="border: 1px solid #ccc; background: #fff;"></iframe>
        </div>
    </div>
</div>
<script>
function searchPrice(productId, productName, country) {
    var value = document.getElementById('input-' + productId).value;
    var prompt = `Average Price for ${productName} in ${country}`;
    // Use Bing search (less likely to block embedding)
    var bingUrl = `https://www.bing.com/search?q=${encodeURIComponent(prompt)}`;
    document.getElementById('search-iframe').src = bingUrl;
}
</script>
{% endblock %}
